<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Challenger</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for feedback animations */
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(10px); }
            50% { opacity: 1; transform: translateY(0); }
        }
        .feedback-animation {
            animation: fadeInOut 2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-2xl mx-auto">
        <!-- Back to Home Link -->
        <div class="mb-4">
            <a href="index.html" class="inline-flex items-center text-indigo-600 font-medium hover:text-indigo-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Home
            </a>
        </div>
        
        <div id="game-container" class="bg-white shadow-2xl rounded-2xl p-6 sm:p-10 text-center">
            
            <h1 class="text-3xl sm:text-4xl font-bold text-indigo-600 mb-4">Vocab Challenger</h1>
            <p id="instructions" class="text-gray-600 mb-6">Read the definition. Type the word for 1 pt, or use a hint for 0.5 pt!</p>
            
            <!-- Game Content -->
            <div id="game-content" class="min-h-[300px]">
                <!-- Definition Display -->
                <div class="bg-indigo-50 p-6 rounded-lg shadow-inner mb-6">
                    <p class="text-lg sm:text-xl font-medium text-gray-800" id="definition-display">
                        Loading definition...
                    </p>
                </div>
                
                <!-- User Input -->
                <div id="text-input-container" class="flex flex-col sm:flex-row gap-2 mb-4">
                    <input type="text" id="answer-input" placeholder="Type your answer..." class="flex-grow w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200">
                    <button id="submit-btn" class="w-full sm:w-auto bg-indigo-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-transform duration-150 active:scale-95">
                        Submit
                    </button>
                </div>

                <!-- Hint Button -->
                <div class="mb-4">
                     <button id="hint-btn" class="w-full sm:w-auto text-indigo-600 font-medium px-4 py-2 rounded-lg hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-150">
                        Show Hint (-0.5 pt)
                    </button>
                </div>

                <!-- Options Container (for hints) -->
                <div id="options-container" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                    <!-- Hint buttons will be generated here -->
                </div>
                
                <!-- Feedback Message -->
                <div id="feedback-message" class="h-8 text-lg font-medium mt-4"></div>
            </div>
            
            <!-- Score and Progress -->
            <div class="flex justify-between items-center mt-6 pt-6 border-t border-gray-200">
                <div class="text-left">
                    <span class="text-gray-500">Score</span>
                    <p class="text-2xl font-bold text-green-600" id="score-display">0</p>
                </div>
                <div class="text-right">
                    <span class="text-gray-500">Progress</span>
                    <p class="text-2xl font-bold text-gray-700" id="progress-display">1 / 10</p>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden text-center py-10">
                <h2 class="text-3xl font-bold text-green-700 mb-4">Great Job!</h2>
                <p class="text-xl text-gray-800 mb-2">You completed the challenge!</p>
                <p class="text-lg text-gray-600 mb-6">Your final score is: <span id="final-score" class="font-bold text-2xl"></span></p>
                <button id="restart-btn" class="bg-indigo-600 text-white font-semibold px-8 py-3 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-transform duration-150 active:scale-95">
                    Play Again
                </button>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const gameContainer = document.getElementById('game-container');
            const gameContent = document.getElementById('game-content');
            const instructions = document.getElementById('instructions');
            const definitionDisplay = document.getElementById('definition-display');
            
            const textInputContainer = document.getElementById('text-input-container');
            const answerInput = document.getElementById('answer-input');
            const submitBtn = document.getElementById('submit-btn');
            
            const hintBtn = document.getElementById('hint-btn');
            const optionsContainer = document.getElementById('options-container');
            
            const feedbackMessage = document.getElementById('feedback-message');
            const scoreDisplay = document.getElementById('score-display');
            const progressDisplay = document.getElementById('progress-display');
            
            const gameOverScreen = document.getElementById('game-over-screen');
            const finalScore = document.getElementById('final-score');
            const restartBtn = document.getElementById('restart-btn');

            // --- 7th Grade Vocabulary List ---
            const vocabList = [
                { word: 'Ambiguous', definition: 'Open to more than one interpretation; unclear.' },
                { word: 'Apprehensive', definition: 'Anxious or fearful that something bad will happen.' },
                { word: 'Conspicuous', definition: 'Clearly visible; attracting notice or attention.' },
                { word: 'Diligent', definition: 'Showing care and effort in one’s work or duties.' },
                { word: 'Elated', definition: 'Extremely happy and excited; ecstatic.' },
                { word: 'Empathy', definition: 'The ability to understand and share the feelings of another.' },
                { word: 'Meticulous', definition: 'Showing great attention to detail; very careful and precise.' },
                { word: 'Ostracize', definition: 'To exclude someone from a society or group.' },
                { word: 'Precarious', definition: 'Not securely held in position; likely to fall or collapse.' },
                { word: 'Resilient', definition: 'Able to withstand or recover quickly from difficult conditions.' }
            ];

            // --- Game State ---
            let score = 0;
            let currentWordIndex = 0;
            let shuffledWords = [];

            // --- Functions ---

            /**
             * Shuffles an array in place.
             */
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            /**
             * Starts or restarts the game.
             */
            function startGame() {
                score = 0;
                currentWordIndex = 0;
                shuffledWords = [...vocabList];
                shuffleArray(shuffledWords);

                // Reset UI
                scoreDisplay.textContent = score;
                progressDisplay.textContent = `1 / ${vocabList.length}`;
                feedbackMessage.textContent = '';
                
                gameContent.style.display = 'block';
                instructions.style.display = 'block';
                gameOverScreen.style.display = 'none';

                loadWord(); // Load the first word
            }

            /**
             * Loads the current word's definition and resets inputs.
             */
            function loadWord() {
                if (currentWordIndex < shuffledWords.length) {
                    definitionDisplay.textContent = shuffledWords[currentWordIndex].definition;
                    progressDisplay.textContent = `${currentWordIndex + 1} / ${vocabList.length}`;
                    
                    // Reset UI for the new word
                    answerInput.value = '';
                    answerInput.disabled = false;
                    submitBtn.disabled = false;
                    hintBtn.disabled = false;
                    
                    textInputContainer.style.display = 'flex'; // Show text input
                    optionsContainer.style.display = 'none';   // Hide options
                    optionsContainer.innerHTML = '';           // Clear old options
                    
                    answerInput.focus();
                } else {
                    endGame();
                }
            }

            /**
             * Shows the hint options (multiple choice).
             */
            function showHint() {
                // Hide text input, show options
                textInputContainer.style.display = 'none';
                optionsContainer.style.display = 'grid'; // Use grid
                hintBtn.disabled = true; // Disable hint button for this question

                const correctWord = shuffledWords[currentWordIndex].word;
                
                // Get 3 random distractors
                const distractors = [];
                const allWords = vocabList.map(v => v.word);
                while (distractors.length < 3) {
                    const randWord = allWords[Math.floor(Math.random() * allWords.length)];
                    // Make sure distractor isn't the correct word or already in the list
                    if (randWord !== correctWord && !distractors.includes(randWord)) {
                        distractors.push(randWord);
                    }
                }

                const options = [correctWord, ...distractors];
                shuffleArray(options); // Shuffle correct answer with distractors

                // Create and append buttons
                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.textContent = option;
                    btn.className = 'option-btn w-full bg-gray-100 text-indigo-700 font-semibold px-4 py-3 rounded-lg shadow-sm hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-transform duration-150 active:scale-95';
                    // Pass `true` for isHint to the checkAnswer function
                    btn.addEventListener('click', () => checkAnswer(option, true));
                    optionsContainer.appendChild(btn);
                });
            }


            /**
             * Checks the user's answer (from text OR hint button).
             */
            function checkAnswer(userAnswer, isHint = false) {
                // Disable all inputs immediately to prevent double submission
                answerInput.disabled = true;
                submitBtn.disabled = true;
                hintBtn.disabled = true;
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

                const correctAnswer = shuffledWords[currentWordIndex].word.toLowerCase();
                const processedUserAnswer = userAnswer.trim().toLowerCase();

                if (processedUserAnswer === correctAnswer) {
                    score += isHint ? 0.5 : 1; // 0.5 points for hint, 1 for typing
                    scoreDisplay.textContent = score;
                    showFeedback('Correct!', 'text-green-600');
                } else {
                    showFeedback(`Correct answer: ${shuffledWords[currentWordIndex].word}`, 'text-red-600');
                }

                currentWordIndex++;
                
                // Wait for feedback to be seen before loading next word
                setTimeout(() => {
                    feedbackMessage.textContent = ''; // Clear feedback
                    loadWord(); // Load the next word or end game
                }, 1500);
            }

            /**
             * Displays feedback to the user with animation.
             */
            function showFeedback(message, colorClass) {
                feedbackMessage.textContent = message;
                feedbackMessage.className = `h-8 text-lg font-medium ${colorClass} feedback-animation`;
                
                // Remove animation class after animation ends
                setTimeout(() => {
                    feedbackMessage.classList.remove('feedback-animation');
                }, 2000);
            }

            /**
             * Ends the game and shows the final score.
             */
            function endGame() {
                gameContent.style.display = 'none';
                instructions.style.display = 'none';
                gameOverScreen.style.display = 'block';
                finalScore.textContent = `${score} / ${vocabList.length}`;
                answerInput.disabled = true;
                submitBtn.disabled = true;
                hintBtn.disabled = true;
            }

            // --- Event Listeners ---
            submitBtn.addEventListener('click', () => checkAnswer(answerInput.value, false));
            hintBtn.addEventListener('click', showHint);
            restartBtn.addEventListener('click', startGame);

            // Allow pressing "Enter" to submit
            answerInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkAnswer(answerInput.value, false);
                }
            });

            // --- Initial Game Start ---
            startGame();
        });
    </script></body>
</html>
